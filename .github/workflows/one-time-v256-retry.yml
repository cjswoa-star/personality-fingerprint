name: one-time-v256-retry
on:
  push:
    paths:
      - '.github/workflows/one-time-v256-retry.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Recover and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(git hash-object index.html)
          test "$CURRENT" = "56b26e1e733c1aa766eb39c1c0550f4508e649fc"
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, gzip
          src=Path('.github/workflows/one-time-v256.yml').read_text(encoding='utf-8')
          m=re.search(r"echo '([^']+)' \\| base64", src)
          if not m:
              raise SystemExit('embedded patch not found')
          s=m.group(1)
          raw=base64.b64decode(s + '='*((-len(s))%4), validate=False)
          Path('/tmp/v256.patch').write_bytes(gzip.decompress(raw))
          PY
          git apply /tmp/v256.patch
          NEW=$(git hash-object index.html)
          test "$NEW" = "e8d60e1862f89a96a019ba420b0ecbc402f71a66"
      - name: Commit v2.5.6
        run: |
          git config user.name 'cjswoa-star'
          git config user.email 'cjswoa@goedu.kr'
          git add index.html
          git commit -m 'Update personality fingerprint to v2.5.6 resilient observer flow'
          git push
