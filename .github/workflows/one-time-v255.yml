name: one-time-v255
on:
  push:
    paths:
      - '.github/workflows/one-time-v255.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified v2.5.5 update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script[^>]*src="//lc\.getunicorn\.org[^>]*></script>\n?', '\n', s, count=1)
          s=s.replace('const APP_VERSION="2.5.3-FIREBASE-REFRESH";','const APP_VERSION="2.5.5-OBSERVER-SYNTHESIS";',1)
          blocks=[
            base64.b64decode('').decode('utf-8'),
            base64.b64decode('').decode('utf-8'),
            base64.b64decode('').decode('utf-8'),
            base64.b64decode('').decode('utf-8'),
            base64.b64decode('').decode('utf-8'),
            base64.b64decode('').decode('utf-8'),
            base64.b64decode('').decode('utf-8'),
          ]
          specs=[
            (r'function observerSynthesis\(p,observers=observerResults\)\{.*?(?=function observerTagText)', blocks[0]),
            (r'function dashObserverHTML\(p\)\{.*?(?=function dashScenarioHTML)', blocks[1]),
            (r'function renderObserverHubSummary\(\)\{.*?(?=async function maybeSubmitObserverRemote)', blocks[2]),
          ]
          for pat,rep in specs:
              s,n=re.subn(pat, lambda m,rep=rep: rep, s, count=1, flags=re.S)
              if n != 1: raise SystemExit(f'replacement failed: {pat} -> {n}')
          p.write_text(s,encoding='utf-8')
          PY
          test "$(git hash-object index.html)" = "56b26e1e733c1aa766eb39c1c0550f4508e649fc"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update observer synthesis to v2.5.5"
          git push
